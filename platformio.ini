; M5Stack Tab5 (ESP32-P4) — Arcane OS shell
; https://docs.platformio.org/page/projectconf.html

[env:tab5]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.21
; `esp32-p4-evboard` is the right PlatformIO board id for P4+Arduino (M5 community uses this;
; there is no m5stack_tab5.json in pioarduino). M5Tab5-UserDemo is ESP-IDF, not a PIO "board" ID.
; Framework `esp32p4` variant = Espressif EV kit pins; retail Tab5 matches espressif/arduino-esp32
; `m5stack_tab5` — vendored under ./variants/ so SDIO/I2C match your hardware.
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.variant = m5stack_tab5
board_build.variants_dir = variants
board_build.flash_mode = qio
board_build.flash_size = 16MB
; Default board config limits app to ~1.25MB; use a larger app partition.
board_build.partitions = huge_app.csv
board_upload.maximum_size = 3145728
; Avoid auto-picking Bluetooth serial on macOS.
upload_port = /dev/cu.usbmodem101
upload_speed = 1500000
monitor_speed = 115200
build_unflags = -Werror
extra_scripts = pre:patch_m5gfx_p4.py
build_flags =
	-std=gnu++17
	-I.pio/libdeps/tab5
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=0
	-DM5STACK_TAB5
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DAPP_LCD_WIDTH=720
	-DAPP_LCD_HEIGHT=1280
	-DLV_CONF_INCLUDE_SIMPLE
	-Iinclude
	-DLV_TICK_PERIOD_MS=5
lib_deps =
	m5stack/M5GFX@0.2.20
	m5stack/M5Unified@0.2.14
	lvgl/lvgl@9.5.0
	WiFi
